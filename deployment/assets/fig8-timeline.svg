<text x="743.0" y="138.0" font-size="12" fill="#57606a" text-anchor="middle" font-weight="400" opacity="1">架构质疑期</text>
<rect x="612.0" y="178.0" width="262.0" height="158.0" rx="12" fill="#ffffff" stroke="#e8590c" stroke-width="1.5"/>
<rect x="612.0" y="178" width="262.0" height="26" rx="12" fill="#e8590c" opacity="0.12"/>
<text x="743.0" y="196.0" font-size="12" fill="#e8590c" text-anchor="middle" font-weight="700" opacity="1">关键词</text>
<text x="628.0" y="220.0" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400" opacity="1">· 大家普遍都是裁缝</text>
<text x="628.0" y="242.0" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400" opacity="1">· 从浆糊里抽一点</text>
<text x="628.0" y="264.0" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400" opacity="1">· 大水池小水管</text>
<text x="628.0" y="286.0" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400" opacity="1">· 柔顺控制棺材板压不住</text>
<text x="628.0" y="308.0" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400" opacity="1">· 不是兄弟真的假的</text>
<rect x="612.0" y="348.0" width="262.0" height="54.0" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="743.0" y="370.5" font-size="12" fill="#57606a" text-anchor="middle" font-weight="400" opacity="1">这一阶段的核心焦虑</text>
<text x="743.0" y="387.9" font-size="12" fill="#57606a" text-anchor="middle" font-weight="400" opacity="1">这套架构本身是不是错的</text>
