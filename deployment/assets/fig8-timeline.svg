<text x="1029.0" y="120.0" font-size="15" fill="#f03e3e" text-anchor="middle" font-weight="700" opacity="1">2026 H1</text>
<text x="1029.0" y="138.0" font-size="12" fill="#57606a" text-anchor="middle" font-weight="400" opacity="1">泡沫期</text>
<rect x="898.0" y="178.0" width="262.0" height="158.0" rx="12" fill="#ffffff" stroke="#f03e3e" stroke-width="1.5"/>
<rect x="898.0" y="178" width="262.0" height="26" rx="12" fill="#f03e3e" opacity="0.12"/>
<text x="1029.0" y="196.0" font-size="12" fill="#f03e3e" text-anchor="middle" font-weight="700" opacity="1">关键词</text>
<text x="914.0" y="220.0" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400" opacity="1">· 左脚踩右脚</text>
<text x="914.0" y="242.0" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400" opacity="1">· 养蛊</text>
<text x="914.0" y="264.0" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400" opacity="1">· 半个行业建立在 Qwen 上</text>
<text x="914.0" y="286.0" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400" opacity="1">· 真机采集就是财务诈骗</text>
<text x="914.0" y="308.0" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400" opacity="1">· 空调测试</text>
<rect x="898.0" y="348.0" width="262.0" height="54.0" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="1029.0" y="370.5" font-size="12" fill="#57606a" text-anchor="middle" font-weight="400" opacity="1">这一阶段的核心焦虑</text>
<text x="1029.0" y="387.9" font-size="12" fill="#57606a" text-anchor="middle" font-weight="400" opacity="1">这门生意算不算得过来账</text>
